name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --target deps -r requirements.txt
      - run: python -B tests/test_chat.py
      - run: python -B tests/test_search.py
      - run: node tests/selection.cjs
      - run: node tests/reader-ui.cjs
      - run: python -B scripts/package_source.py
